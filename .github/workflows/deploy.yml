name: deploy-site
# Đưa giao diện lên ngay khi sửa code (không chờ lấy giá)
on:
  push:
    branches: [main]
    paths: ["site/*.html", "site/*.js", "site/*.css", "site/*.json", "site/*.svg", "site/*.png", "site/*.ico", "site/*.xml", "site/*.txt", "site/data/**", "radar/*.py", ".github/workflows/deploy.yml"]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: deploy-site, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: fonts + Pillow (ảnh giá /share/)
        run: |
          sudo apt-get install -y -qq fonts-noto-core fonts-noto-cjk >/dev/null || true
          pip install -q pillow || true
      - name: build SEO pages (/p, /c, sitemap, llms.txt)
        run: python -m radar.pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - uses: actions/deploy-pages@v4

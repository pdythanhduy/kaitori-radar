name: deploy-site
# Đưa giao diện lên ngay khi sửa code (không chờ lấy giá)
on:
  push:
    branches: [main]
    paths: ["site/*.html", "site/*.js", "site/*.css", "site/*.json", "site/*.svg", "site/*.png", "site/*.ico", "site/*.xml", "site/*.txt", ".github/workflows/deploy.yml"]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: deploy-site, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - uses: actions/deploy-pages@v4

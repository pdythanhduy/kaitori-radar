name: update-prices
on:
  schedule:
    - cron: "30 18 * * *"        # 03:30 JST: toàn bộ danh mục
    - cron: "0 23,0-13 * * *"     # 08:00–22:00 JST mỗi tiếng: hàng hot
  workflow_dispatch:
    inputs:
      mode: { description: "hot | full", default: "hot" }
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: scrape
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "30 18 * * *" ]; then MODE=full; else MODE=hot; fi
          fi
          python -m radar.run --$MODE
      - name: commit data
        run: |
          git config user.name "kaitori-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add site/data data_raw site/sitemap.xml
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
      - run: git pull --rebase -X theirs || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - uses: actions/deploy-pages@v4

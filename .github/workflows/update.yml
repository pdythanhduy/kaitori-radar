name: update-prices
on:
  # Lịch chạy do Cloudflare Worker "kaitori-cron" gọi (cron/worker.js) — đúng giờ hơn lịch GitHub (hay trễ/bỏ lượt):
  #   10:47 JST full, 10:07–22:37 JST mỗi 30 phút hot. Dự phòng: 1 lượt full lúc 06:48 JST nếu Worker hỏng.
  schedule:
    - cron: "48 21 * * *"
  workflow_dispatch:
    inputs:
      mode: { description: "hot | full", default: "hot" }
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: scrape
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            MODE=full  # lượt dự phòng 06:48 JST
          fi
          python -m radar.run --$MODE
      - name: commit data
        run: |
          git config user.name "kaitori-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add site/data data_raw
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
      - run: git pull --rebase -X theirs || true
      - name: build SEO pages (/p, /c, sitemap, llms.txt)
        run: python -m radar.pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - uses: actions/deploy-pages@v4

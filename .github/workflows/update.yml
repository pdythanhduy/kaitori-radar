name: update-prices
on:
  schedule:
    - cron: "47 1 * * *"            # 10:47 JST: toàn bộ danh mục (sau khi các tiệm mở cửa, cập nhật giá ~10:00)
    - cron: "7,37 1-13 * * *"       # 10:07–22:37 JST mỗi 30 phút: hàng hot (phút lẻ để GitHub ít trễ)
  workflow_dispatch:
    inputs:
      mode: { description: "hot | full", default: "hot" }
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: scrape
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "47 1 * * *" ]; then MODE=full; else MODE=hot; fi
          fi
          python -m radar.run --$MODE
      - name: commit data
        run: |
          git config user.name "kaitori-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add site/data data_raw
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
      - run: git pull --rebase -X theirs || true
      - name: build SEO pages (/p, /c, sitemap, llms.txt)
        run: python -m radar.pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - uses: actions/deploy-pages@v4

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kaitori Price｜So sánh giá thu mua (買取価格比較) ở Nhật — iPhone, máy game, Pokémon, máy ảnh</title>
<link rel="canonical" href="https://kaitoriprice.com/">
<meta property="og:site_name" content="Kaitori Price">
<meta property="og:url" content="https://kaitoriprice.com/">
<meta property="og:title" content="Kaitori Price｜買取価格比較 — So sánh giá thu mua mỗi giờ">
<meta name="description" content="So sánh giá thu mua hàng mới (新品・未開封) tại các tiệm kaitori lớn ở Nhật mỗi giờ: iPhone, PS5, Switch, hộp thẻ Pokémon, máy ảnh, gia dụng. Biết ngay tiệm nào trả cao nhất.">
<link rel="stylesheet" href="style.css?v=8">
</head>
<body>
<header class="hd">
  <div class="wrap hd-in">
    <a class="logo" href="./"><span class="logo-dot"></span><span data-i18n="brand">Kaitori Price</span></a>
    <div class="hd-r">
      <span class="upd" id="upd"></span>
      <button class="lang" id="lang" aria-label="language">日本語</button>
    </div>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <h1><span data-i18n="h1a">Bán ở đâu được giá nhất?</span><br><span class="hl" data-i18n="h1b">So sánh giá thu mua mỗi giờ</span></h1>
    <p id="heroStat"></p>
    <input id="q" class="hero-q" type="search" autocomplete="off">
  </div>
</section>

<main class="wrap">
  <nav class="chips" id="chips"></nav>

  <section id="home">
    <h2 class="sec"><span data-i18n="topTitle">💡 Chênh lệch giá lớn nhất hôm nay</span> <small data-i18n="topSub">cùng một món, mỗi tiệm trả một giá</small></h2>
    <div id="top" class="list"></div>
  </section>

  <section id="catview" class="layout" hidden>
    <aside class="side" id="side">
      <div class="side-hd"><b data-i18n="filters">🔎 Bộ lọc</b><button class="side-x" id="sideClose" aria-label="close">✕</button></div>
      <div id="facets"></div>
      <div class="side-ft"><button class="reset" id="reset" data-i18n="reset">Xoá lọc</button><button class="apply" id="apply" data-i18n="apply">Xem kết quả</button></div>
    </aside>
    <div class="results">
      <div class="rbar">
        <button class="fbtn" id="fbtn"><span data-i18n="filters">🔎 Bộ lọc</span> <b id="fCount"></b></button>
        <span class="hint" id="hint"></span>
        <select id="sort"></select>
        <div class="vtog" id="vtog"><button data-v="card" class="on">▦</button><button data-v="table">☰</button></div>
      </div>
      <div class="active" id="active"></div>
      <div id="list" class="list"></div>
      <button id="more" class="more" hidden data-i18n="more">Xem thêm</button>
      <p class="empty" id="empty" hidden data-i18n="empty">Không có sản phẩm phù hợp.</p>
    </div>
  </section>

  <section id="deals" hidden>
    <div class="pr-note" data-i18n="prNote"></div>
    <div id="dealList"></div>
  </section>
</main>
<div class="scrim" id="scrim"></div>

<footer class="ft">
  <div class="wrap">
    <p data-i18n="ft1"></p>
    <p data-i18n="ft2"></p>
    <p id="shops"></p>
    <p class="small">© 2026</p>
  </div>
</footer>
<script src="i18n.js?v=8"></script>
<script src="facets.js?v=8"></script>
<script src="app.js?v=8"></script>
</body>
</html>

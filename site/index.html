<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>買取レーダー｜ポケカBOX・iPhone 買取価格を毎日比較</title>
<meta name="description" content="森森買取・買取ホムラ・モバイル一番など大手買取店のポケカ未開封BOXとiPhone新品の買取価格を毎日自動で比較。一番高く売れる店が一目でわかります。">
<meta property="og:title" content="買取レーダー｜買取価格を毎日比較">
<meta property="og:description" content="ポケカBOX・iPhoneの買取価格を大手買取店で毎日比較。最高値の店と価格推移がすぐわかる。">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hd">
  <div class="wrap hd-in">
    <a class="logo" href="./"><span class="logo-dot"></span>買取レーダー</a>
    <span class="upd" id="upd">読み込み中…</span>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <h1>どこで売るのが一番高い？<br><span>買取価格を毎日自動で比較</span></h1>
    <p>大手買取店の公開価格を1日数回チェック。ポケカ未開封BOXとiPhone新品（SIMフリー）の最高値の店と値動きがひと目でわかります。</p>
  </div>
</section>

<main class="wrap">
  <nav class="tabs" id="tabs">
    <button data-cat="pokebox" class="on">🃏 ポケカBOX</button>
    <button data-cat="iphone_new">📱 iPhone 新品未開封</button>
  </nav>
  <div class="tools">
    <input id="q" type="search" placeholder="商品名で検索（例：ロケット団、17 Pro）" autocomplete="off">
    <select id="sort">
      <option value="rec">おすすめ（複数店比較を優先）</option>
      <option value="best">買取価格が高い順</option>
      <option value="spread">店舗間の価格差が大きい順</option>
      <option value="change">前日から上がった順</option>
      <option value="drop">前日から下がった順</option>
      <option value="name">名前順</option>
    </select>
    <label class="chk"><input type="checkbox" id="multi"> 複数店で比較できる商品のみ</label>
  </div>
  <p class="hint" id="hint"></p>
  <div id="list" class="list"></div>
  <p class="empty" id="empty" hidden>該当する商品がありません。</p>
</main>

<footer class="ft">
  <div class="wrap">
    <p><b>買取レーダー</b> は各買取店の公式サイトに公開されている価格を自動取得して表示する比較サイトです。</p>
    <p>※価格は取得時点の参考値です。状態（シュリンクの有無・傷）・色・在庫状況・キャンペーンにより実際の買取額は変わります。売却前に必ず各店舗の最新価格をご確認ください。</p>
    <p id="shops"></p>
    <p class="small">© 2026 買取レーダー</p>
  </div>
</footer>
<script src="app.js"></script>
</body>
</html>
